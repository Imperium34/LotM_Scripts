# ═════════════════════════════════════════════════════════════════════
# ELENENLER — hepsi %100 benzerlik almıştı
#
#   贝西克街 → Wright     Besik SOKAĞI; Wright o sokaktaki handa çalıştığı
#                        için ikisi hep aynı bölümlerde geçiyor. Skor
#                        birlikte geçmeyi ölçüyor, çeviriyi değil. Bu,
#                        listedeki en öğretici yanlış.
#   霍尔伯爵 → Kont       "Kont Hall"; 霍尔 zaten Hall'a bağlı, çakışır.
#   管家 → Klee           kâhya. 安保人员 (güvenlik görevlisi) ve 维克罗尔
#   安保人员 → Klee        (Vikroll) da Klee'ye bağlanmış: üç ayrı şey, tek
#   维克罗尔 → Klee        hedef. Üçü de yanlış.
#   慈善 → İşçi           hayırseverlik ≠ işçi.
#   创世神话 → Yaradan     yaratılış miti ≠ Yaradan. 造物主 doğru olan.
#   会呈现 → Nefs         fiil öbeği, ad değil.
#   特殊行动部 → Birim     "Birim" fazla genel; başka yerlerde de geçer.
#   第七小组 → Birim       aynı hedefe ikinci bir kaynak — biri yanlış.
#   老尼尔 → İhtiyar       "Old Neil"; 尼尔 → Neil ile çakışır.
#   福生玄黄 → Arz         ayin hitabının parçası; TR tarafta yalnızca ilk
#                        kelime yakalanmış. Sayı eşitliği tutmayabilir.
#   机械之神 → Çarkların   aynı sorun: TR unvan çok kelimeli.
#   廷根市改善住 → Konut   uzun bileşik; 廷根 zaten Tingen'e bağlı.
#
