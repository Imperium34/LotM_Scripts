- terim: "Şirazesini Yitirmek (Şirazeden Çıkmak)"
  ingilizce: "Losing Control"
  kategori: "Temel Kavramlar"
  aciklama: "Bir Aşkın'ın iksirin kudretini sindirememesi, yüksek mertebeli habis bir varlığın yozlaştırmasına maruz kalması ve daha nice sebepler sonucu benliğini yitirmesi durumu. Bu safhaya geçen bir Aşkın; insanlığını, aklî melekelerini ve ruhunu sonsuza dek kaybederek bedeni korkunç şekillerde mutasyona uğramış, kana susamış irrasyonel bir canavara dönüşür. Her Aşkın'ın eninde sonunda yüzleşmekten korktuğu nihai ve kaçınılmaz kabustur."
  cevirmen_notu: "Şiraze, bir kitabın formalarını bir arada tutan dikiş bandıdır; 'şirazesi çıkmak' ise Türkçede düzenini, tutarlılığını yitirmek anlamında yerleşik bir deyimdir. 'Kontrolü kaybetmek' literal karşılık olurdu, 'delirmek' veya 'çıldırmak' ise kolay ama yanlış olurdu. Çünkü bu evrende Şirazesini Yitirmek yalnızca delilik değildir. Aşkın ortadan kalkmaz, bütünlüğü dağılır. Güçleri, hafızası, bedeni yerinde durmaya devam eder ama artık hiçbiri bir arada tutulmamaktadır ve kişi bu yüzden bir canavara dönüşür. Şiraze tam olarak bunu adlandırır: kitap durur, sayfalar durur, yalnızca onları bir arada tutan şey gitmiştir. Deyimin bir başka avantajı, çeviri kokmamasıdır; Türkçe konuşan biri bu ifadeyi zaten bilir, dolayısıyla terim metne yabancı bir teknik etiket gibi değil, dilin kendi malzemesi gibi yerleşir."
  spoiler: true
  bolum_siniri: 14
  kaynak: metin
  mudahale: ceviri
  denetim: denetlenmedi

