  cevirmen_notu: "Bu tazim ismi literal çeviri değildir; kanondaki üç satırdan ikisi korunmuş, bir tanesi bilinçli olarak kullanılmamış ve yerine iki satır ('Müşfik Peder', 'Cümle Cürümü Sırtlayan Rab') eklenmiştir. Gerekçe bir yöntem tercihidir: tazim isimleri bir varlığın objektif tarifi değil, ona inananların ağzından okunan ayinsel bir hitaptır. Dolayısıyla bir kilisenin kendi ilahını nasıl yücelteceği, o ilahın gerçekte ne olduğundan farklı olabilir ve olmalıdır da. Buradaki satırlar, bu ilaha tapanların onu nasıl gördüğünü yansıtacak biçimde seçilmiştir. Aynı ilkenin sonucu olarak, kanondaki daha yıkıcı ve mesafeli satır bu girdide değil, başka bir girdide değerlendirilmiştir." 
  cevirmen_notu_ek:
    - sinir: 9999
      baslik: "Çıkarılan satır nereye gitti"
