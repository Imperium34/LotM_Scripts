- terim: "Soytarı"
  ingilizce: "The Fool"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  aciklama: "Bu asra mensup olmayan Soytarı,<br>Gri sislerin fevkindeki esrarlı Hükümdar,<br>Talihe hükmeden Sarı ve Siyahın Kralı."
  cevirmen_notu: "Aptal, Ahmak, Budala, Meczup gibi doğrudan karşılıklar yerine 'Soytarı' seçildi. Tarot destesinde 0 numaralı kart bir aptallığı değil; bir başlangıcı, kuralların dışına çıkmayı ve henüz biçimlenmemiş sonsuz potansiyeli imler. 'Aptal' bu kartın hiçbir anlamını taşımaz, yalnızca bir hakaret taşır. Klein özelinde daha da belirleyici bir gerekçe var: bu ismi seçtiği sahnede kendisiyle sürekli dalga geçen, ne olduğunu bilmediği bir dünyada rol yapan biridir. Kendine 'aptal' ya da 'şapşal' demek şaka değil, sövgü olurdu. 'Soytarı' demek ise dürüstlüktür. Aşkınların varlığından bile habersizken ilah rolü oynayan bir adamın kendi durumunu tam olarak tarif etmesidir. Sözcük, dünyayı kurmadan önce karakteri kuruyor."
  cevirmen_notu_ek:
    - sinir: 251
      baslik: "Yolun dokusu"
      metin: "Tercihi destekleyen ikinci bir gözlem var. Kâhin yolunun bilinen ilk mertebeleri (Kâhin, Palyaço, Hokkabaz, Suretsiz, Kukla Üstadı) istisnasız birer icra mesleğidir. Dahası bu icranın sahnesi kademe kademe büyür: bir kâhin köhne bir çadırda, palyaço sokakta veya sirkte, hokkabaz boş bir sahnede, kukla üstadı ise kuklaları için kurulmuş donanımlı bir sahnede çalışır. Yolun tamamı, güç basamaklarından çok bir icracının kariyeri gibi kurgulanmıştır. Türkçe karşılıklar bu dokuyu korumak üzere seçildi; 'Soytarı' da bu meslekler ailesine aittir, hakaret sözlüğüne değil."
 
    - sinir: 1384
      baslik: "Yükselişin vardığı yer"
      metin: "Yukarıdaki yükseliş boşuna değildir. Sahne büyüdükçe icracının mevkisi de yükselir ve varılacak yer, performansın hem en yüksek hem en tehlikeli konumudur: hükümdarın huzuru. Kâhin Yolunun Tanrısı, hiçbir şey oynamadığı anın bile bir gösteri gibi durduğu nihai icracıdır; sahnesi dünyanın tamamı, seyircisi ölümlülerle ilahlardır. Kanonik tanım da bunu destekler: 'her şeyi kandıran bir hile ustası' denir ve mucizeleri 'sergilemek'ten söz edilir. Dahası Soytarı, bir yıldızı yok edebilecekken doğrudan bir yıldızla karşılaşamayacak kadar kırılgan olarak tarif edilir. Sınırsız imtiyaz, sıfır zırh. Bir saray soytarısının konumu tam olarak budur. Tarot tarafındaki 'köke dönüş' anlamı da burada tamamlanır: Garabet Efsuncusu, Mazinin Alimi, Mucizekâr ve Esrar Hadimi mertebelerinin tuhaflığından sonra ilahın yeniden bir icracı olması, yolun çıktığı yere dönmesidir. Kabiliyetler bunu pekiştirir; bu mertebede tarih, zaman ve kader birbirine dolanır, olmuş ile olacak ayırt edilemez hâle gelir."
 
    - sinir: 1384
      baslik: "Kabul edilen kayıp"
      metin: "Bu tercihin bir bedeli var: kanondaki Kandırma salahiyeti ve onun Kör Ahmaklık sembolü, adın kendisinde duyulmaz. Buna karşılık kanon da bu ikisini ayrı katmanlarda tutar. Ahmaklık ilahın adında değil, salahiyetin sembolündedir. Bu sözlükte de öyle dağıtıldı: ad Soytarı, salahiyet Kandırma, sembol Kör Ahmaklık. 'Kandırmak' hem 'yalanı hakikat kılmak' etkisini birebir karşılar hem de Amon'un hilekârlık/aldatmaca alanıyla çakışmaz. İlahı mekaniğine göre adlandırmak, Ölüm'e sırf bir sıfatı öyle diye 'Ebedi Uykucu' demeye benzerdi; ad, varlığın ne olduğunu taşımalıdır."
  spoiler: true
  bolum_siniri: 5
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

- terim: "Esrarın Hükümdarı"
  ingilizce: "Lord of the Mysteries"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  aciklama: "Esrarın Hükümdarı,<br>Zaman ve Mekan Sultanı,<br>Kaderin Mihenk Taşı,<br>Aslî Kale'nin Tecessümü,<br>Alem-i Ervah Hakimi."
  cevirmen_notu: "İlk tercih 'Meşale' idi ama Çince '道标' (yol işareti) ışıktan çok yön göstermeyle ilgilidir. 'Mihenk Taşı' (mihenk/dokunma taşı, kıymet ölçüm standardı) tercih edildi çünkü Korkak Üçlü Yollarının en üstünde bulunun bu varlık temelde hakikati sahteden ayırır hatta gerçek ve sahtenin ne olduğuna karar verendir. 'Beacon' burada yön göstermekten çok kader/hakikatin sınandığı bir ölçüt olarak okunabilir. Poetik nesne-imge korunmuş, anlam yönü kesinlik/doğrulama eksenine kaydırılmıştır.<br>'Sultan' bilinçli seçildi çünkü Soytarı Yolu'nun Mertebe 1 ismi 'Esrar Hadimi'dir (İngilizce: Attendant of Mysteries) ve bu iki unvan arasında saltanat temalı bir tutarlılık istendi."
  spoiler: true
  bolum_siniri: 1271
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

- terim: "Semavi Muazzez"
  ingilizce: "Celestial Worthy of Heaven and Earth"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Esrarın Hükümdarı (Lord of the Mysteries)"
  aciklama: "Arz ve Semanın Lütufkâr Baki Efendisi;<br>Arz ve Semanın Lütufkâr Gök Hakimi;<br>Arz ve Semanın Lütufkâr Ulu İlahı;<br>Arz ve Semanın Lütufkâr Semavi Muazzez."
  cevirmen_notu: "Kanonda bu unvan sırası açık bir tırmanış izler (Baki Efendisi → Gök Hakimi → Ulu İlahı → Semavi Muazzez), ancak 'Muazzez' (sevgili/aziz) bilinçli olarak en yüksek sırada 'mutlak/yüce' ağırlıklı bir kelime yerine tercih edildi. Sebep: bu unvanın sahibi aslında önceki Esrarın Hükümdarı'dır ve bu, Batı Kıtası'ndaki takma kimliğidir. Okuyucunun ilk okumada unvanın gücünden onun gerçek kimliğini/kudretini sezmemesi hedeflendi. 'Muazzez'in sıcak/şefkatli çağrışımı, en güçlü olanın burada kasıtlı olarak en az tehditkâr görünmesini sağlıyor. Bu bir çeviri zayıflığı değil, anlatısal bir kamuflaj tercihidir."
  cevirmen_notu_sinir: 1271
  spoiler: true
  bolum_siniri: 2
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

- terim: "Kadir-i Mutlak"
  ingilizce: "God Almighty"
  kategori: "İlahlar ve Yüce Kadimler"
  yol_grubu: "Kadir-i Mutlak (God Almighty)"
  aciklama: "Kadir-i Mutlak,<br>Hâlık,<br>Bari,<br>Alimi ve Kudreti Mutlak,<br>Alem-i Misal Efendisi."
  cevirmen_notu: "Bu girdinin ve bağlı yolların İslami terminolojiyle karşılanması, bu çevirinin en çok sorgulanacak tercihidir. Kadir-i Mutlak, serinin İbrahimî tektanrıcılık tasavvurudur: yaratan, her şeyi bilen ve her şeye gücü yeten bir Hâlık; Âdem; düşüş. Bu figür Hristiyanlığa özgü değildir, üç dinin ortak atasıdır. Türkçenin tektanrılı bir yaratıcıdan söz ederken sahip olduğu en derin, en gelişmiş sözcük dağarcığı ise İslamîdir; çünkü o dağarcığı kuran gelenek budur. Dolayısıyla Esmâ-ül Hüsnâ'dan gelen Hâlık, Bari, Alîm ve Kadîr'e başvurmak bir mezhep aktarması değil, Türkçede bu yükseklikte iş gören tek kaydı kullanmaktır. Yöntem, 'Mertebe' tercihiyle aynıdır: Mertebeler gerçekten de manevi makamlardır ve Türkçe bu kavramları tasavvuf sözlüğünde saklar. Sözcükler ait oldukları göndergeye göre seçilmiştir, süs olsun diye değil. Bazı okuyucuların bu tercihi rahatsız edici bulabileceğinin farkındayım. Özellikle serinin ilerleyen bölümlerinde bu figürün izlediği seyir düşünüldüğünde, itiraz muhtemelen adlandırmaya değil olay örgüsüne gelecektir. Yine de kayıt açıktır: burada kullanılan kelimeler, kurgusal bir varlığı gerçek bir inancın yerine koymak için değil, o varlığın romandaki işlevini Türkçede en iyi ve isabetli şekilde karşılamak için seçilmiştir."
  spoiler: true
  bolum_siniri: 1260
  kaynak: metin
  mudahale: ceviri
  denetim: tamam

