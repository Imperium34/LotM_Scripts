- terim: "Mertebe"
  ingilizce: "Sequence"
  kategori: "Temel Kavramlar"
  aciklama: "Bir yol içindeki güç seviyesi. En zayıf halka olan 9'dan başlar ve efsanevi 1. Mertebeye (Melek) kadar yükselir."
  cevirmen_notu: "'Seviye', 'Kademe' ya da doğrudan 'Sekans' gibi karşılıklar teknik olarak doğru olurdu ama boş kalırdı. Hepsi yalnızca bir sıralama bildirir. Oysa bu basamaklar sadece güç dereceleri değildir: her biri kişinin kendisini dönüştürmesini gerektirir, bedeli akıl sağlığıdır ve bir üst basamağa çıkmak bir kudret artışından çok bir hâl değişimidir. Türkçe bu kavramı yüzyıllardır tasavvuf sözlüğünde saklar. 'Mertebe', seyr ü sülûkta yolcunun eriştiği manevi makamdır. Çalışılarak, dönüşülerek varılan bir konum. Kavramın karşılığı Türkçede zaten mevcuttu. Yani icat edilmesi değil, bulunması gerekiyordu. Bu tercih aynı zamanda 'Yol' (Pathway) karşılığını da yerine oturtur: tasavvufta yol tarikattır ve bir yolun mertebeleri vardır. İngilizcede Pathway ile Sequence birbirine teknik olarak bağlanır; Türkçede Yol ile Mertebe birbirine hem teknik hem kavramsal olarak bağlanır. İkisi tek bir kavram dünyasından geldiği için, sistemin tamamı Türkçede kendiliğinden tutarlı bir dil kazanır."
  spoiler: false
  bolum_siniri: 6
  kaynak: metin
  mudahale: ceviri
  denetim: denetlenmedi

